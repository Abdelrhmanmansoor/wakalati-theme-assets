name: fetch-salla-abaya-images
on:
  push:
    branches: [salla-abaya-images]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from Drive
        run: |
          mkdir -p salla-abayas
                    fail=0
          while read -r name id; do
            out="salla-abayas/abaya-$name.jpg"
            curl -sSL --retry 3 -o "$out" "https://drive.google.com/uc?export=download&id=$id"
            if ! file "$out" | grep -qi 'image'; then echo "FAILED $name $id"; rm -f "$out"; fail=1; fi
          done < salla-abaya-list.txt
          ls -la salla-abayas
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add salla-abayas
          git commit -m "Add Salla abaya product images" || echo "nothing to commit"
          git push
